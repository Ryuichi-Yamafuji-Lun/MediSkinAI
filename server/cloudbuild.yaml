steps:
# 1. Build the Docker image (tagged with the unique build ID so older images are
#    never overwritten and earlier revisions stay deployable for rollback)
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/$PROJECT_ID/skin-lesion-service:$BUILD_ID', '.']

# 2. Push the image
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/skin-lesion-service:$BUILD_ID']

# 3. Deploy to Cloud Run with cost guards
#    - min-instances 0: scales to zero, nothing billed while idle
#    - max-instances 1: hard ceiling on compute spend, even under abuse
#    - cpu-throttling: CPU billed only while a request is in flight
#    - 1 vCPU / 2 GiB: the model peaks around 0.6 GB of memory
#    - timeout 120s: matches the frontend's request timeout
#    Env vars (GOOGLE_API_KEY) are kept from the existing service.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
  - 'run'
  - 'deploy'
  - 'skin-lesion-service'
  - '--image'
  - 'gcr.io/$PROJECT_ID/skin-lesion-service:$BUILD_ID'
  - '--platform'
  - 'managed'
  - '--region'
  - 'us-west1'
  - '--allow-unauthenticated'
  - '--min-instances'
  - '0'
  - '--max-instances'
  - '1'
  - '--cpu'
  - '1'
  - '--memory'
  - '2Gi'
  - '--cpu-throttling'
  - '--cpu-boost'
  - '--timeout'
  - '120'

images:
- 'gcr.io/$PROJECT_ID/skin-lesion-service:$BUILD_ID'
